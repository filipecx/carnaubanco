name: Backend CI Pipeline (Java & Docker)
on:
 push:
   branches: [ "main" ]
   paths:
     - 'user-service/**'
     - 'wallet-service/**'
     - '.github/workflows/**'
 pull_request:
   branches: [ "main" ]
jobs:
 build-and-test:
   name: Build & Test (Java 21)
   runs-on: ubuntu-latest
   steps:
     - name: 🛎️ Checkout Repository
       uses: actions/checkout@v4
     - name: ☕ Setup Java JDK 21
       uses: actions/setup-java@v4
       with:
         java-version: '21'
         distribution: 'temurin'
         cache: 'maven' # Isso é um diferencial: faz cache das dependências para acelerar o build
     - name: 🧪 Compile Code (User Service)
       run: mvn clean compile -B --file user-service/pom.xml
     - name: 🧪 Compile Code (Wallet Service)
       run: mvn clean compile -B --file wallet-service/pom.xml
     - name: 🐳 Validate Dockerfile (User Service)
       # Garante que as mudanças no código não quebraram o multi-stage build
       run: docker build -t user-service-ci ./user-service
     - name: 🐳 Validate Dockerfile (Wallet Service)
       run: docker build -t wallet-service-ci ./wallet-service

