server:
  port: 8082

spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:postgresql://localhost:5432/db_wallet_service
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info